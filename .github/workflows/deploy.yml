name: 部署 AI 投资研究看板

on:
  # 监听所有会影响线上内容的路径
  # ⚠️ 必须包含 dashboard-data-v3.json 和 data/** ——
  #    漏掉会导致 workflow 不触发（当前 build_type=legacy 时 Pages 直读分支，
  #    但切到 Actions 模式或用它强制刷 CDN 缓存时就会失效）
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'dashboard-data-v3.json'
      - 'dashboard-data.json'
      - 'data/dashboard-data.json'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  # 允许手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: '部署原因（可选）'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# 避免重复部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
